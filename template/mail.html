<!--
  Modèle du courrier non classé. Même cadre que mail-alert.html.
  Chaque bloc a un titre et un seul texte. Un bloc vide est retiré.
  Les mots TITLE, MAIL_SUBTITLE, MAIL_FOOTER, MAIL_SEEN, CONTENT,
  MAIL_CHECK, ADVICE, MAIL_NEXT, NOTE et NOTE_CMD sont remplacés à l'envoi.
-->
<!DOCTYPE html>
<html lang="${MAIL_LANG}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${TITLE}</title>
</head>
<body style="margin:0;background-color:#1e1e1e;color:#cccccc;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1e1e1e" style="width:100%;background-color:#1e1e1e;margin:0;padding:0;">
<tr>
<td align="center" style="padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:760px;margin:0 auto;">
<tr>
<td style="padding:0 0 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e5b684;">
<tr>
<td align="center" style="padding:14px 16px;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;color:#cccccc;">${TITLE}</td>
</tr>
</table>
</td>
</tr>
<tr>
<td align="center" style="padding:0 0 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;color:#44aae6;">${MAIL_SUBTITLE}</td>
</tr>
<tr>
<td style="padding:0 0 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e5b684;">
<tr>
<td style="padding:12px 16px 4px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_SEEN}</td>
</tr>
<tr>
<td style="padding:4px 16px 14px;">
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${CONTENT}</pre>
</td>
</tr>
</table>
</td>
</tr>
<!--ADVICE_START-->
<tr>
<td style="padding:0 0 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e5b684;">
<tr>
<td style="padding:12px 16px 4px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_CHECK}</td>
</tr>
<tr>
<td style="padding:4px 16px 14px;">
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${ADVICE}</pre>
</td>
</tr>
</table>
</td>
</tr>
<!--ADVICE_END-->
<!--NOTE_START-->
<tr>
<td style="padding:0 0 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e5b684;">
<tr>
<td style="padding:12px 16px 4px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_NEXT}</td>
</tr>
<tr>
<td style="padding:4px 16px 14px;">
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${NOTE}
${NOTE_CMD}</pre>
</td>
</tr>
</table>
</td>
</tr>
<!--NOTE_END-->
<tr>
<td align="center" style="padding:8px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#e5b684;">${MAIL_FOOTER}</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
