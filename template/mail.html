<!--
  Modèle d'alerte. Les mots TITLE, G_PROJECT_NAME, HOSTNAME, DATE, MODULE_NAME,
  CONTENT, ADVICE, NOTE et NOTE_CMD, écrits avec un dollar et des accolades, sont
  remplacés à l'envoi. Le bloc ADVICE_START / ADVICE_END est retiré quand le
  conseil est vide. Le bloc NOTE_START / NOTE_END est retiré quand la note
  est vide. Pour un autre style, ajoutez un fichier .html dans ce dossier et
  nommez-le dans G_MAIL_TEMPLATE (global.conf). Défaut : mail.html.
-->
<!DOCTYPE html>
<html lang="${MAIL_LANG}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${G_PROJECT_NAME} • ${HOSTNAME} • ${DATE}</title>
</head>
<body style="margin:0;padding:0;background-color:#0f172a;color:#e2e8f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="width:100%;background-color:#0f172a;margin:0;padding:0;">
<tr>
<td align="center" style="padding:12px;">
<!--[if mso]>
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td>
<![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#111827" style="width:100%;max-width:600px;table-layout:fixed;background-color:#111827;margin:0 auto;">
<tr>
<td style="padding:16px;border-bottom:1px solid #334155;font-family:Arial,Helvetica,sans-serif;">
<div style="margin:0;font-size:22px;line-height:1.3;font-weight:bold;color:#f8fafc;">${TITLE}</div>
<div style="margin:4px 0 0;font-size:13px;line-height:1.4;color:#94a3b8;">${G_PROJECT_NAME} • ${HOSTNAME} • ${DATE}</div>
</td>
</tr>
<tr>
<td style="padding:16px 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#cbd5e1;">
<strong>${MAIL_MODULE}</strong> ${MODULE_NAME}
</td>
</tr>
<tr>
<td style="padding:16px;font-family:Consolas,Courier New,monospace;">
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#020617;border:1px solid #334155;border-radius:8px;padding:16px;color:#e2e8f0;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${CONTENT}</pre>
</td>
</tr>
<!--ADVICE_START-->
<tr>
<td style="padding:0 16px 16px;font-family:Consolas,Courier New,monospace;">
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#020617;border:1px solid #334155;border-radius:8px;padding:16px;color:#e2e8f0;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${ADVICE}</pre>
</td>
</tr>
<!--ADVICE_END-->
<!--NOTE_START-->
<tr>
<td style="padding:0 16px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1e293b" style="width:100%;background-color:#1e293b;border:1px solid #334155;border-radius:8px;">
<tr>
<td style="padding:16px;font-family:Arial,Helvetica,sans-serif;">
<p style="margin:0 0 12px;font-size:13px;line-height:1.55;color:#e2e8f0;">${NOTE}</p>
<pre style="margin:0;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#020617;border:1px solid #334155;border-radius:8px;padding:12px;color:#86efac;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;overflow-x:auto;">${NOTE_CMD}</pre>
</td>
</tr>
</table>
</td>
</tr>
<!--NOTE_END-->
<tr>
<td bgcolor="#1e293b" style="background-color:#1e293b;padding:16px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.4;color:#64748b;text-align:center;">
${G_PROJECT_NAME}
</td>
</tr>
</table>
<!--[if mso]>
</td></tr></table>
<![endif]-->
</td>
</tr>
</table>
</body>
</html>
