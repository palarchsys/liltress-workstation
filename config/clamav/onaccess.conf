# =============================================================================
# File       : config/clamav/onaccess.conf
# Updated at : 2026-11-07
# Creator    : palarchsys
# =============================================================================
# -----------------------------------------------------------------------------
# Purpose    : On-access paths and size.
# Note       : ONACCESS_MOUNTS=1 adds /media and /mnt.
# Note       : Fixed excludes are merged by apply-scan-skip.sh.
# -----------------------------------------------------------------------------

ONACCESS_MARKER="Liltress Workstation onaccess"
ONACCESS_EXCLUDE_UNAME=clamav
ONACCESS_EXCLUDE_ROOTUID=yes
ONACCESS_MAX_FILE_SIZE=25M
ONACCESS_PREVENTION=yes
ONACCESS_EXTRA_SCANNING=yes
ONACCESS_MOUNTS=1
ONACCESS_FIXED_EXCLUDE="/var/lib/snapd /snap /var/lib/clamav/quarantine /var/lib/clamav/tmp /var/log"
CLAMAV_TEMPORARY_DIRECTORY=/var/lib/clamav/tmp
CLAMAV_QUARANTINE=/var/lib/clamav/quarantine
CLAMONACC_BIN=/usr/sbin/clamonacc
CLAMONACC_LOG=/var/log/clamav/clamonacc.log
CLAMONACC_RESTART=on-failure
CLAMONACC_RESTART_SEC=5
CLAMAV_VIRUS_EVENT_PRESERVE=CLAM_VIRUSEVENT_FILENAME,CLAM_VIRUSEVENT_VIRUSNAME
