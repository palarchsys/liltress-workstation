# =============================================================================
# -----------------------------------------------------------------------------
# Purpose    : On-access paths and size.
# Note       : W_ONACCESS_MOUNTS=1 adds /media and /mnt.
# Note       : Fixed excludes are merged by apply-scan-skip.sh.
# -----------------------------------------------------------------------------

# Shared

# Server

# Workstation

W_ONACCESS_MARKER="Liltress Workstation onaccess"
W_ONACCESS_EXCLUDE_UNAME=clamav
W_ONACCESS_EXCLUDE_ROOTUID=yes
W_ONACCESS_MAX_FILE_SIZE=25M
W_ONACCESS_PREVENTION=yes
W_ONACCESS_EXTRA_SCANNING=yes
W_ONACCESS_MOUNTS=1
W_ONACCESS_FIXED_EXCLUDE="/var/lib/snapd /snap /var/lib/clamav/quarantine /var/lib/clamav/tmp /var/log"
W_CLAMAV_TEMPORARY_DIRECTORY=/var/lib/clamav/tmp
W_CLAMAV_QUARANTINE=/var/lib/clamav/quarantine
W_CLAMONACC_BIN=/usr/sbin/clamonacc
W_CLAMONACC_LOG=/var/log/clamav/clamonacc.log
W_CLAMONACC_RESTART=on-failure
W_CLAMONACC_RESTART_SEC=5
W_CLAMAV_VIRUS_EVENT_PRESERVE=CLAM_VIRUSEVENT_FILENAME,CLAM_VIRUSEVENT_VIRUSNAME
