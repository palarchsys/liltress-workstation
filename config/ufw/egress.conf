# -----------------------------------------------------------------------------
# Purpose    : Outbound journal, and short isolation after a detection.
# Note       : The log table is installed on every configure.
# Note       : A detection isolates new outbound flows for NET_ISOLATE_SEC seconds.
# Note       : Established flows, loopback and DNS stay accepted during that window.
# -----------------------------------------------------------------------------

NET_ISOLATE_SEC=120
