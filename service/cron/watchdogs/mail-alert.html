<!DOCTYPE html>
<html lang="${MAIL_LANG}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${TITLE}</title>
</head>
<body style="margin:0;background-color:#1e1e1e;color:#cccccc;min-height:100vh;font-family:Arial,Helvetica,sans-serif;">

<tr>

</table>
</td>
</tr>

</tr>
</table>
</td>
</tr>

</td>
</tr>
</table>
