<!DOCTYPE html>
<html lang="${MAIL_LANG}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${TITLE}</title>
</head>
<body style="margin:0;background-color:#1e1e1e;color:#cccccc;min-height:100vh;font-family:Arial,Helvetica,sans-serif;">
<div style="min-width:400px;max-width:800px;width:100%;margin:0 auto;padding:24px;box-sizing:border-box;">
<h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;color:#f14c4c;">${TITLE}</h1>
<p style="margin:0 0 24px;font-size:14px;line-height:1.4;color:#44aae6;">${MAIL_SUBTITLE}</p>
<h2 style="margin:0 0 8px;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_BLOCK_SERVICES}</h2>
<pre style="margin:0 0 20px;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;border:1px solid #e5b684;border-radius:8px;padding:12px;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre;overflow-x:auto;">${MAIL_SERVICES}</pre>
<h2 style="margin:0 0 8px;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_BLOCK_FILES}</h2>
<pre style="margin:0 0 20px;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;border:1px solid #e5b684;border-radius:8px;padding:12px;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre;overflow-x:auto;">${MAIL_FILES}</pre>
<h2 style="margin:0 0 8px;font-size:16px;line-height:1.4;color:#e5b684;">${MAIL_BLOCK_ACTIONS}</h2>
<pre style="margin:0 0 20px;width:100%;max-width:100%;box-sizing:border-box;display:block;background-color:#1e1e1e;border:1px solid #35cc94;border-radius:8px;padding:12px;color:#cccccc;font-family:Consolas,Courier New,monospace;font-size:13px;line-height:1.45;white-space:pre;overflow-x:auto;">${MAIL_ACTIONS}</pre>
<p style="margin:8px 0 0;font-size:13px;line-height:1.4;color:#e5b684;">${MAIL_FOOTER}</p>
</div>
</body>
</html>
